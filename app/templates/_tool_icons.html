{# Line icons for the tools (24px grid, stroke = currentColor). #}

<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if slug == "scripting" -%}
  <path d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14 7l3 3"/><path d="M13 20h7"/>
{%- elif slug == "translations" -%}
  <path d="M4 5h8"/><path d="M8 3v2"/><path d="M10 5c-.6 3.5-2.6 6-5.5 7.5"/><path d="M6 8.5c1 1.6 2.6 3 4.5 3.8"/><path d="M12.5 21l4-10 4 10"/><path d="M14 17.5h5"/>
{%- elif slug == "seo" -%}
  <circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/><path d="M8 12.5l2-2.5 1.5 1.5 2-3"/>
{%- elif slug == "editing" -%}
  <rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 9h18"/><path d="M7 5v4"/><path d="M12 5v4"/><path d="M17 5v4"/><path d="M10 12.5v4l3.5-2z"/>
{%- elif slug == "uploading" -%}

{%- elif slug == "admin" -%}
  <path d="M4 6h10"/><path d="M18 6h2"/><circle cx="16" cy="6" r="2"/><path d="M4 12h2"/><path d="M10 12h10"/><circle cx="8" cy="12" r="2"/><path d="M4 18h12"/><path d="M20 18h0"/><circle cx="18" cy="18" r="2"/>
{%- endif -%}
</svg>
{%- endmacro %}
