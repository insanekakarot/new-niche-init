[project]
name = "new-niche-overall"
version = "0.1.0"
description = "FastAPI service"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.4",
    # Source script from a video link: its captions (YouTube; other sites via yt-dlp).
    "youtube-transcript-api>=1.2",
    "yt-dlp>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
# The desktop window (python -m app.desktop): pywebview with the Qt backend.
desktop = ["pywebview[qt]>=5.3"]

[project.scripts]
new-niche-desktop = "app.desktop:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
